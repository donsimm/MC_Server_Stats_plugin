# ServerStats - Konfiguration
# Nach Aenderungen: /serverstats reload
#
# config-version: Bei einer neuen Plugin-Version mit neuer Standard-Config wird diese Datei als config-v<alt>.yml.bak gesichert
# und durch die neue ersetzt. Eigene Einstellungen danach aus der Sicherung uebernehmen.
config-version: 16

# Titel und Untertitel der Seite
title: "Stats-Tafel"
subtitle: "Ranglisten unseres Servers"

# Wie oft die Ranglisten neu berechnet werden (Sekunden) und wie oft die Online-Liste aktualisiert wird
refresh-seconds: 300
online-refresh-seconds: 30

# Ausgabeordner fuer stats.json, online.json, Kopf-Bilder und die Webseite (relativ zum Plugin-Ordner)
output-dir: "web"
# true: die mitgelieferte Webseite (index.html, app.js, style.css) wird bei jedem Start ueberschrieben.
# Auf false stellen, wenn du die Dateien selbst anpasst.
overwrite-web-files: true

# Eingebauter Webserver (liefert nur Dateien aus output-dir aus).
# Wer bereits nginx/Apache nutzt, setzt enabled auf false und zeigt den Webserver auf den Ausgabeordner.
http:
  enabled: true
  bind: "0.0.0.0"
  port: 8123
  # Adresse, die /serverstats link den Spielern anzeigt
  public-url: "http://localhost:8123"

# Weitere Statistiken automatisch als Ranglisten: jeder Zaehler aus minecraft:custom (Truhen geoeffnet, Fische gefangen,
# Schaden ausgeteilt, ...), der noch keine eigene Rangliste unten hat, bekommt eine auf der Seite "page".
auto-stats:
  enabled: true
  page: "Alle Statistiken"
  # Mindestanzahl Spieler mit einem Wert ueber 0, damit die Rangliste erscheint
  min-players: 1

# Live-Anzeige (online): Welt -> Symbol. Angezeigt wird "Symbol Weltname". Unbekannte Welten erscheinen nur mit Namen.
worlds:
  DoNs_World: "🌍"
  DoNs_World_nether: "☠"
  DoNs_World_the_end: "★"
  farmwelt: "⛏"
  farmwelt_nether: "⛏"
  farmwelt_the_end: "⛏"
  Creativ_World: "🎨"
  OneBlock_World: "🧊"
  Skyblock_World: "☁"
  skyworld: "🗻"
  skyworld_nether: "🗻"
  Plot_World_A: "🏙"
  witp: "□"
  iep: "○"

# Schaltflaechen rechts im Menue. Eine leere Adresse blendet die jeweilige Schaltflaeche aus.
links:
  homepage-label: "Homepage"
  homepage-url: "https://simmeneventsupport.wixsite.com/website"
  discord-url: "https://discord.com/invite/9ssUcjEbZS"

# Museum: sammelt die Advancements des Datapacks "All Mob Heads" aller Spieler und zeigt, welche Koepfe schon gesammelt wurden.
museum:
  enabled: true
  title: "Museum"
  # Namensraeume der Datapack-Advancements. Leer = automatisch (Namensraum mit "head", "mob" oder "skull" im Namen).
  # Wird nichts gefunden, steht die Liste der vorhandenen Namensraeume im Log bzw. unter /serverstats status.
  namespaces: []
  # Optional: nur Advancements, deren Pfad eines dieser Woerter enthaelt (z. B. ["head"]). Leer = alle.
  contains: []

players:
  # Leer lassen = automatisch suchen (world/stats bzw. world/players/stats).
  stats-dir: ""
  advancements-dir: ""
  exclude-uuids: []
  exclude-names: []
  # Spieler, die laenger nicht online waren, ausblenden (0 = alle zeigen)
  max-inactive-days: 0
  # Spieler im Vanish-Modus nicht in der Online-Liste zeigen
  hide-vanished: true

# Spielerkoepfe (werden von den Mojang-Servern geholt, einmal pro Spieler zwischengespeichert)
heads:
  enabled: true
  refresh-days: 7

sources:
  mcmmo:
    enabled: true
    # Obergrenze der Skala im Skill-Radar (Modus "Absolut")
    radar-max: 1000
  vault:
    enabled: true
    # Namen von Konten, die nicht in der Rangliste erscheinen sollen (Server-/NPC-Konten)
    exclude-names: []
  essentials:
    # Fuer AFK-Anzeige in der Online-Liste
    enabled: true
  cookieclicker:
    # Plugin CookieClickerZ (KartoffelChipss). Die Datenbank wird nur gelesen.
    enabled: true
    # sqlite oder mysql (so wie unter storage.type in der config.yml von CookieClickerZ eingestellt)
    type: sqlite
    # relativ zum plugins-Ordner
    sqlite-file: "CookieClickerZ/userData.db"
    mysql:
      host: "localhost"
      port: 3306
      database: "cookieclicker"
      user: "root"
      password: ""
    players-table: "players"
  jobs:
    # Plugin AethelJobs. Die Spielerdateien (playerdata/<uuid>.yml) werden nur gelesen.
    enabled: true
    # relativ zum plugins-Ordner
    folder: "AethelJobs/playerdata"
  skyblock:
    # Plugin uSkyBlock. Gelesen werden islands/<x,z>.yml und data/challenge-progress.db (nur lesend).
    enabled: true
    # relativ zum plugins-Ordner
    folder: "uSkyBlock"
  oneblock:
    # Plugin OneBlock (MrMarL), Speicherart json (PlData.json). H2 und MySQL werden nicht unterstuetzt.
    enabled: true
    # relativ zum plugins-Ordner
    file: "Oneblock/PlData.json"
  parkour:
    # Plugin Infinite Parkour Reborn (IP, IPPlus, IEP in einem). Gelesen werden IP/leaderboards/*.json (Block) und
    # IP/elytra/leaderboards/*.json (Elytra), nur lesend. MySQL-Speicherung wird nicht unterstuetzt.
    enabled: true
    # relativ zum plugins-Ordner
    folder: "IP"
  dailyrewards:
    # Plugin DailyRewards2: Streaks aus der SQLite-Datei (nur lesend, die IP-Spalte wird nicht gelesen).
    enabled: true
    # relativ zum plugins-Ordner
    sqlite-file: "DailyRewards2/dailyrewards.db"
    table: "player_data"
    # Der gespeicherte Streak bleibt stehen, bis der Spieler wieder abholt. Liegt die letzte Abholung laenger zurueck
    # als diese Stunden, zaehlt der aktuelle Streak als verfallen (2 x day-length + streak-grace-time = 60).
    streak-valid-hours: 60
  ajlb:
    # AJLeaderboards ueber PlaceholderAPI. Nur fuer Zeitfenster (Monat, Woche, Heute) und Kategorien mit source: ajlb.
    # Die Platzhalter-Schreibweise kann je nach AJLB-Version abweichen: mit /serverstats ajlb <board> pruefen.
    enabled: true
    top: 30
    name-placeholder: "%ajlb_lb_{board}_{pos}_name{suffix}%"
    value-placeholder: "%ajlb_lb_{board}_{pos}_value{suffix}%"
    # {suffix} bleibt fuer "Gesamt" leer, sonst "_" plus der Name hier
    period-names:
      day: "daily"
      week: "weekly"
      month: "monthly"

# Kennzahlen oben auf der Startseite (Summe aller Spieler). Die Kategorie muss weiter unten existieren.
chips:
  - { category: dauerzocker, label: "Spielzeit gesamt" }
  - { category: abrissbirne, label: "Blöcke abgebaut" }
  - { category: friedhof, label: "Tode" }
  - { category: weltenbummler, label: "Strecke gesamt" }
  - { category: keksbaecker, label: "Kekse gebacken" }

# Ranglisten. Die Reihenfolge hier ist die Reihenfolge auf der Seite.
#   page:      "Tab" oder "Tab|Abschnitt" (mehrere Abschnitte auf einer Seite, z. B. "Jobs & mcMMO|Jobs"). "Übersicht" = Startseite, sonst Reiter in der Navigation (mcMMO, Cookie Clicker, Jobs). Neue Namen ergeben neue Reiter.
#   format:  int | dur (Wert in Stunden) | km | big (Mio./Mrd./Bio. ...) | adv (x / Gesamtzahl) | dec (eine Nachkommastelle) | level ("Level 16")
#   icon:    clock gem skull pick sword swords boot scroll bolt star heart shield cookie cursor gear
#   source:  vanilla | advancements | vault | mcmmo-power | cookieclicker (column: COOKIES, CLICKS, PER_CLICK, PRESTIGE) | jobs (column: Job-Name oder *) | skyblock (column: LEVEL, CHALLENGES, COMPLETIONS, PARTY) | oneblock (column: LEVEL, INVITED) | parkour (stat: block:<modus> oder elytra:<modus>, column: SCORE oder TIME) | dailyrewards (column: CURRENT, LONGEST, CLAIMS) | ajlb
#   vanilla: stat (Liste, erster Treffer zaehlt) oder sum (Liste, addiert) oder group-sum (ganze Gruppe), plus scale
#   ajlb-board: AJLeaderboards-Board fuer Zeitfenster (optional)
#   include-zero: true = auch Spieler mit dem Wert 0 listen (z. B. "hat eine Insel")
