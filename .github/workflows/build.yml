name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - uses: actions/upload-artifact@v4
        with:
          name: ServerStats
          path: target/ServerStats-*.jar

      # Das fertige JAR liegt danach unter "Releases" (ein Eintrag pro Branch, wird bei jedem Push ersetzt).
      - name: Publish rolling pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" target/ServerStats-*.jar \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Build $GITHUB_REF_NAME (${GITHUB_SHA::7})" \
            --notes "Automatischer Build von Branch $GITHUB_REF_NAME, Commit $GITHUB_SHA."
